# ==============================================
# ISL Translator — Docker Compose (Local Dev)
# ==============================================
# Usage: docker compose -f infrastructure/docker-compose.yml up --build
# ==============================================

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80
      - MPLCONFIGDIR=/tmp/matplotlib
    volumes:
      - ../backend/app:/app/app  # Hot reload in dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: isl-network
